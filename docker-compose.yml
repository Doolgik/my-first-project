services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: messenger
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  # Self-hosted Pusher-compatible realtime broker (holds the WebSocket
  # connections). On Vercel you'd use Pusher Channels instead of this service.
  soketi:
    image: quay.io/soketi/soketi:1.6-16-debian
    restart: unless-stopped
    command: ['--config=/app/config.json']
    volumes:
      - ./deploy/soketi.json:/app/config.json:ro
    ports:
      - '6001:6001'

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/messenger?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      PUSHER_APP_ID: messenger
      PUSHER_KEY: messenger-key
      PUSHER_SECRET: messenger-secret
      PUSHER_HOST: soketi
      PUSHER_PORT: '6001'
      PUSHER_USE_TLS: 'false'
    ports:
      - '4000:4000'

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: /api
        VITE_PUSHER_KEY: messenger-key
        VITE_PUSHER_HOST: ${PUSHER_PUBLIC_HOST:-localhost}
        VITE_PUSHER_PORT: '6001'
        VITE_PUSHER_USE_TLS: 'false'
    restart: unless-stopped
    depends_on:
      - server
      - soketi
    ports:
      - '8080:80'

volumes:
  pgdata:
