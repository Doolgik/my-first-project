services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: messenger
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/messenger?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
    volumes:
      - uploads:/app/uploads
    ports:
      - '4000:4000'

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: /api
        VITE_SOCKET_URL: ''
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - '8080:80'

volumes:
  pgdata:
  uploads:
